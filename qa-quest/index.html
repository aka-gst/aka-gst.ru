<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Интерактивный курс: питон с нуля, тестирование и работа с LLM. Python запускается прямо в браузере — устанавливать ничего не нужно." />
  <title>QA Quest — питон, тестирование и LLM в браузере</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Карточка для мессенджеров. Ссылку на курс кидают в переписку, и от того,
       как она там выглядит, зависит, откроет её человек или пролистает.
       Картинка пересобирается из tools/og-card.html, см. README. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="aka-gst" />
  <meta property="og:url" content="https://aka-gst.ru/qa-quest/" />
  <meta property="og:title" content="Научиться писать код, ничего не устанавливая" />
  <meta property="og:description" content="Настоящий Python запускается прямо в браузере. Первый шаг — три минуты, знать заранее ничего не надо." />
  <meta property="og:image" content="https://aka-gst.ru/qa-quest/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="QA Quest — к карте курса">
        <span class="brand-mark">Q<span>_</span></span>
        <span><strong>QA QUEST</strong><small>ПИТОН · ТЕСТЫ · LLM</small></span>
      </a>

      <div class="mode-switch" role="group" aria-label="Режим подачи">
        <button type="button" data-mode="sprint" aria-pressed="true">Пробежать</button>
        <button type="button" data-mode="deep" aria-pressed="false">Разобрать</button>
      </div>

      <div class="profile-strip">
        <button type="button" id="streakChip" class="streak-chip" title="Серия дней">🔥 0</button>
        <div class="level-chip"><span>УРОВЕНЬ</span><strong id="profileLevel">1</strong></div>
        <div class="xp-block">
          <div><span>ОПЫТ</span><b id="xpLabel">0 / 120 XP</b></div>
          <div class="xp-track"><i id="xpBar"></i></div>
        </div>
        <button type="button" id="accountButton" class="account-button">Войти</button>
      </div>
    </header>

    <div class="status-strip">
      <!-- Возврат на сайт. Общесайтовая кнопка .game-home-menu прибита к
           правому верхнему углу и накрыла бы «Войти» и полосу опыта, поэтому
           здесь свой вариант — как у практикумов и photodata. -->
      <a class="site-back" href="https://aka-gst.ru/">← aka-gst.ru</a>
      <span id="pythonChip" class="python-chip" data-status="idle">Python: не загружен</span>
      <span id="modeHint" class="mode-hint"></span>
      <span id="progressHint" class="progress-hint">Прогресс сохраняется в этом браузере</span>
      <button type="button" id="resetProgress" class="text-button">Сбросить прогресс</button>
    </div>

    <main>
      <section id="mapScreen" class="map-screen"></section>
      <section id="lessonScreen" class="workspace" hidden></section>
    </main>
  </div>

  <dialog id="accountDialog" class="account-dialog">
    <div class="dialog-head">
      <strong>Общий вход aka-gst</strong>
      <button type="button" id="closeDialog" class="text-button" aria-label="Закрыть">✕</button>
    </div>
    <div id="accountBody" class="dialog-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Тот же обезличенный счётчик, что на главной: без кук и профилей.
       Нужен, чтобы видеть, на каком уроке люди останавливаются. -->
  <script defer src="/pulse/script.js" data-website-id="de024048-c4c3-4639-bbdf-808c558f6d71"></script>
  <script>
    // Имя телеграм-бота без собаки. Пока пусто, кнопка «здесь непонятно»
    // просто отмечает место в счётчике; с именем — открывает переписку с
    // автором и приносит туда номер шага. Бот: ops/questbot.
    window.QA_QUEST_BOT = '';
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
