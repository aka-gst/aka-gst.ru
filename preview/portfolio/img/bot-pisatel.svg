<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="g" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#a855f7" stop-opacity=".22"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#9a90b2"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#1b1528"/><rect width="1280" height="720" fill="url(#g)"/>
  <text x="64" y="92" fill="#caa8ff" font-size="30" font-weight="700" letter-spacing="2">СОАВТОР ДЛЯ ПИСАТЕЛЯ · СХЕМА</text>
  <!-- автор -->
  <rect x="64" y="250" width="230" height="150" rx="22" fill="#15111f" stroke="#2a2440" stroke-width="3"/>
  <text x="179" y="316" fill="#ece8f5" font-size="38" font-weight="700" text-anchor="middle">Автор</text>
  <text x="179" y="358" fill="#9a90b2" font-size="25" text-anchor="middle">пишет боту</text>
  <path d="M300 325H356" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <!-- очередь -->
  <rect x="366" y="230" width="270" height="190" rx="22" fill="#15111f" stroke="#a855f7" stroke-width="3"/>
  <text x="501" y="300" fill="#caa8ff" font-size="36" font-weight="700" text-anchor="middle">Очередь</text>
  <text x="501" y="344" fill="#ece8f5" font-size="26" text-anchor="middle">задания</text>
  <text x="501" y="378" fill="#ece8f5" font-size="26" text-anchor="middle">не теряются</text>
  <path d="M642 290L706 206" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <path d="M642 360L706 444" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <!-- движки -->
  <rect x="716" y="120" width="300" height="150" rx="20" fill="#15111f" stroke="#6aa0ff" stroke-width="3"/>
  <text x="866" y="186" fill="#9cc0ff" font-size="32" font-weight="700" text-anchor="middle">Облачная</text>
  <text x="866" y="228" fill="#9a90b2" font-size="24" text-anchor="middle">нейросеть</text>
  <text x="866" y="320" fill="#f5b042" font-size="24" font-weight="600" text-anchor="middle">облако упало? →</text>
  <rect x="716" y="370" width="300" height="160" rx="20" fill="#15111f" stroke="#34d39e" stroke-width="3"/>
  <text x="866" y="434" fill="#6ee7b7" font-size="32" font-weight="700" text-anchor="middle">Своя, запасная</text>
  <text x="866" y="476" fill="#9a90b2" font-size="24" text-anchor="middle">на компьютере,</text>
  <text x="866" y="506" fill="#9a90b2" font-size="24" text-anchor="middle">без интернета</text>
  <path d="M1022 206L1076 300" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <path d="M1022 444L1076 350" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <!-- текст -->
  <rect x="1084" y="250" width="144" height="150" rx="22" fill="#15111f" stroke="#2a2440" stroke-width="3"/>
  <text x="1156" y="316" fill="#ece8f5" font-size="32" font-weight="700" text-anchor="middle">Текст</text>
  <text x="1156" y="356" fill="#9a90b2" font-size="22" text-anchor="middle">готов</text>
  <rect x="64" y="580" width="1164" height="84" rx="18" fill="#15111f" stroke="#2a2440" stroke-width="2"/>
  <text x="96" y="633" fill="#ece8f5" font-size="30">Помощник не пропадает, когда облако лежит — <tspan fill="#6ee7b7" font-weight="700">есть запасной</tspan></text>
</svg>
