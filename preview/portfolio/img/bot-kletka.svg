<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="g" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#a855f7" stop-opacity=".22"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#9a90b2"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#1b1528"/><rect width="1280" height="720" fill="url(#g)"/>
  <text x="64" y="92" fill="#caa8ff" font-size="30" font-weight="700" letter-spacing="2">БОТ В КЛЕТКЕ · СХЕМА</text>
  <!-- телефон -->
  <rect x="64" y="200" width="240" height="250" rx="24" fill="#15111f" stroke="#2a2440" stroke-width="3"/>
  <text x="184" y="290" fill="#ece8f5" font-size="34" font-weight="700" text-anchor="middle">Голосовое</text>
  <text x="184" y="334" fill="#9a90b2" font-size="26" text-anchor="middle">с телефона</text>
  <text x="184" y="400" fill="#f5b042" font-size="22" text-anchor="middle">чужим — тишина</text>
  <path d="M310 325H366" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <!-- клетка -->
  <rect x="376" y="140" width="520" height="370" rx="26" fill="#15111f" stroke="#a855f7" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="408" y="196" fill="#caa8ff" font-size="34" font-weight="700">ИИ внутри клетки</text>
  <rect x="408" y="226" width="456" height="70" rx="16" fill="#12261f" stroke="#34d39e" stroke-width="2"/>
  <text x="432" y="272" fill="#6ee7b7" font-size="28" font-weight="600">✓ рабочая папка — можно</text>
  <g font-size="28" font-weight="600">
    <rect x="408" y="314" width="456" height="56" rx="14" fill="#2a1a12" stroke="#f5b042" stroke-width="2"/><text x="432" y="352" fill="#f5b042">✗ пароли и ключи — нельзя</text>
    <rect x="408" y="382" width="456" height="56" rx="14" fill="#2a1a12" stroke="#f5b042" stroke-width="2"/><text x="432" y="420" fill="#f5b042">✗ личные документы — нельзя</text>
  </g>
  <text x="408" y="484" fill="#9a90b2" font-size="23">закрыто системой, а не просьбой к ИИ</text>
  <path d="M902 325H958" stroke="#9a90b2" stroke-width="4" marker-end="url(#a)"/>
  <!-- результат -->
  <rect x="968" y="200" width="248" height="250" rx="24" fill="#15111f" stroke="#2a2440" stroke-width="3"/>
  <text x="1092" y="290" fill="#ece8f5" font-size="34" font-weight="700" text-anchor="middle">Файл</text>
  <text x="1092" y="334" fill="#9a90b2" font-size="26" text-anchor="middle">в папке проекта</text>
  <text x="1092" y="370" fill="#9a90b2" font-size="26" text-anchor="middle">на компьютере</text>
  <!-- проверка -->
  <rect x="64" y="572" width="1152" height="92" rx="18" fill="#15111f" stroke="#2a2440" stroke-width="2"/>
  <text x="96" y="630" fill="#ece8f5" font-size="30">Клетка проверяется запуском: <tspan fill="#6ee7b7" font-weight="700">своё читается</tspan>, <tspan fill="#f5b042" font-weight="700">закрытое — нет</tspan></text>
</svg>
