  <circle cx="25" cy="28" r="11.5" fill="none" stroke="#67e8f9" stroke-width="7"/>
  <path d="M29 34 L37 43" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
  <path d="M43 43 h9" stroke="#72f1b8" stroke-width="6.5" stroke-linecap="round"/>
