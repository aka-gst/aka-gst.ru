<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Едва заметная сетка терминала. Плитка 120×120, поверх идёт основной
       текст — поэтому линии почти невидимы: заметность здесь была бы
       вредом, а не украшением. -->
  <g stroke="#67e8f9" stroke-width="1" opacity="0.045">
    <path d="M0 .5H120M0 60.5H120"/>
    <path d="M.5 0V120M60.5 0V120"/>
  </g>
  <g fill="#a78bfa" opacity="0.05">
    <circle cx="60.5" cy="60.5" r="1.4"/>
    <circle cx=".5" cy=".5" r="1.4"/>
  </g>
</svg>
